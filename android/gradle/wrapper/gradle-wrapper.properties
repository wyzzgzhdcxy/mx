# 指向本机已安装的 Gradle 9.7.1 发行版归档，不再联网下载。
# 归档位置：E:\application\java\gradle-9.7.1-bin.zip（与 E:\application\java\gradle-9.7.1 同源）。
# 换机器或移动该文件时，把这里改回官方/镜像 URL 即可：
